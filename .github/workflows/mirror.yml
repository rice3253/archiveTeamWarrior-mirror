name: Mirror ArchiveTeam Warrior

on:
  schedule:
    - cron: "5 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull source image
        run: |
          docker pull atdr.meo.ws/archiveteam/warrior-dockerfile:latest

      - name: Tag image
        run: |
          docker tag \
          atdr.meo.ws/archiveteam/warrior-dockerfile:latest \
          ghcr.io/${{ github.repository_owner }}/archiveteam-warrior:latest

      - name: Push image
        run: |
          docker push \
          ghcr.io/${{ github.repository_owner }}/archiveteam-warrior:latest
